name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.95.0-bookworm

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: psql
          POSTGRES_DB: drop4crop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:psql@postgres:5432/drop4crop_test
      TILE_CACHE_URI: redis://redis:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL
        run: apt-get update && apt-get install -y libgdal-dev clang libclang1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # One database is shared by every test, and each one truncates it, so the
      # suite runs on a single thread.
      - name: Test
        run: cargo test -- --test-threads=1
